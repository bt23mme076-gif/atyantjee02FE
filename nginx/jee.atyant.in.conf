##############################################################################
# Nginx config for jee.atyant.in
#
# Architecture:
#   - Express backend (Node.js) running on port 5000
#   - React frontend (static build) located at /var/www/jee-atyant/dist
#
# HOW TO DEPLOY:
#   1. Copy this file to /etc/nginx/sites-available/jee.atyant.in
#   2. Run: sudo ln -s /etc/nginx/sites-available/jee.atyant.in /etc/nginx/sites-enabled/
#   3. Update the `root` path below if your dist folder is in a different location.
#   4. Run: sudo nginx -t && sudo systemctl reload nginx
##############################################################################

server {
    listen 80;
    server_name jee.atyant.in;
    # Redirect HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name jee.atyant.in;

    # --- SSL Certs (Let's Encrypt) ---
    ssl_certificate     /etc/letsencrypt/live/jee.atyant.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jee.atyant.in/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # --- Frontend static build root ---
    # Update this path to wherever you placed the `npm run build` dist output.
    root /var/www/jee-atyant/dist;
    index index.html;

    # -------------------------------------------------------------------
    # 1. API routes → proxy to Express on port 5000
    #    IMPORTANT: this block MUST come BEFORE the SPA fallback block.
    #    Without it, nginx's try_files serves index.html for /api/* and
    #    PDF/video uploads open as a blank React page.
    # -------------------------------------------------------------------
    location /api/ {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        proxy_connect_timeout  10s;
        proxy_send_timeout     60s;
        proxy_read_timeout     120s;  # generous for large file uploads

        # Disable buffering so large uploads stream through cleanly
        proxy_request_buffering off;
        proxy_buffering         off;
    }

    # -------------------------------------------------------------------
    # 2. Health check → Express
    # -------------------------------------------------------------------
    location /health {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
    }

    # -------------------------------------------------------------------
    # 3. Hashed static assets — very long cache (Vite fingerprints them)
    # -------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # -------------------------------------------------------------------
    # 4. SPA fallback — serves index.html for any path NOT matched above.
    #    Because /api/ is matched first, uploaded files are NEVER caught here.
    # -------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
